<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b42"><link rel="manifest" href="/manifest.json"><title>JusteParler</title><style>body{margin:0;background:#eff6f3;color:#123b42;font:18px system-ui}main{max-width:480px;margin:5vh auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}section{background:white;padding:24px;border-radius:24px;box-shadow:0 8px 30px #123b4212}button{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:14px;background:#12665d;color:white;font:600 17px system-ui}button.secondary{background:#e4efed;color:#123b42}small{display:block;line-height:1.5}label{display:block;margin:20px 0}#status{min-height:50px}button[hidden]{display:none}</style><main><h1>JusteParler<span style="color:#39a58c">.</span></h1><p>Une voix. Une écoute. Un moment pour toi.</p><section><div id="status" role="status">Choisis ton espace.</div><label id="consent"><input type="checkbox" id="agree"> J’ai 18 ans ou plus et je respecte la confidentialité et les autres personnes.</label><button id="talk">J’ai besoin de parler</button><button id="listen" class="secondary">Je peux écouter</button><button id="mute" hidden>Couper le micro</button><button id="end" hidden class="secondary">Terminer</button><button id="report" hidden class="secondary">Signaler et quitter</button><audio id="remote" autoplay playsinline></audio><small>Service d’écoute entre adultes, non médical. En danger immédiat : 112. Souffrance suicidaire : 3114. Ne partage pas tes coordonnées. Les appels ne sont pas enregistrés par cette application.</small></section></main><script>
const $=id=>document.getElementById(id);let token,stream,pc,room,timer,ice=[],generation=0;const api=async(path,data)=>{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Connexion au service indisponible');return r.json()};const status=s=>$('status').textContent=s;function controls(active){for(let id of ['talk','listen','consent'])$(id).hidden=active;for(let id of ['mute','end','report'])$(id).hidden=!active}async function finish(report=false,notify=true){generation++;clearTimeout(timer);let t=token;token=null;if(pc)pc.close();pc=null;room=null;ice=[];if(stream)stream.getTracks().forEach(t=>t.stop());stream=null; $('remote').srcObject=null;controls(false);if(t&&notify)try{await api(report?'/report':'/leave',{token:t,reason:report?'Signalement utilisateur':''})}catch{}status('Conversation terminée. Tu peux recommencer.')}async function start(role){if(!$('agree').checked)return status('Confirme les conditions pour continuer.');controls(true);let g=++generation;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(g!==generation){stream.getTracks().forEach(t=>t.stop());return}token=(await api('/join',{role})).token;status('Recherche d’une personne disponible…');poll(g)}catch(e){await finish();status('Micro ou service indisponible : '+e.message)}}async function signal(data){await api('/signal',{token,room,data})}async function connect(e){room=e.room;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];$('remote').play().catch(()=>status('Appuie sur l’écran pour activer le son.'))};pc.onicecandidate=e=>{if(e.candidate)signal({candidate:e.candidate}).catch(()=>{})};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected')status('En conversation');if(pc?.connectionState==='failed')status('Connexion audio impossible sur ce réseau. Termine et réessaie.')};status('Connexion audio en cours…');if(e.offer){await pc.setLocalDescription(await pc.createOffer());await signal({description:pc.localDescription})}}async function poll(g){try{let r=await api('/poll',{token});if(g!==generation)return;for(let e of r.events){if(e.type==='ended'){await finish(false,false);return}if(e.type==='match')await connect(e);if(e.type==='signal'&&e.room===room&&pc){let d=e.data;if(d.description){await pc.setRemoteDescription(d.description);for(let c of ice)await pc.addIceCandidate(c);ice=[];if(d.description.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());await signal({description:pc.localDescription})}}if(d.candidate){if(pc.remoteDescription)await pc.addIceCandidate(d.candidate);else ice.push(d.candidate)}}}if(g===generation)timer=setTimeout(()=>poll(g),800)}catch(e){if(g===generation){await finish();status(e.message)}}}$('talk').onclick=()=>start('talk');$('listen').onclick=()=>start('listen');$('end').onclick=()=>finish();$('report').onclick=()=>finish(true);$('mute').onclick=()=>{if(!stream)return;let t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$('mute').textContent=t.enabled?'Couper le micro':'Réactiver le micro'};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></html>
