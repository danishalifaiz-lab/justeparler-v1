
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JusteParler - Mon compte</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef8f5;
  color: #163e38;
  padding: 20px;
}
main {
  max-width: 420px;
  margin: 50px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  font-size: 16px;
}
input { border: 1px solid #aaa; }
button {
  background: #087d68;
  color: white;
  border: none;
  cursor: pointer;
}
#message { font-weight: bold; }
</style>
</head>
<body>
<main>
<h1>JusteParler</h1>
<p>Un espace pour parler et être écouté.</p>

<h2>Créer mon compte</h2>
<form id="register">
<input id="email" type="email"
 placeholder="Adresse e-mail" required>
<input id="password" type="password"
 placeholder="Mot de passe (12 caractères minimum)"
 minlength="12" required>
<label>
<input type="checkbox" id="adult"
 style="width:auto" required>
Je confirme avoir 18 ans ou plus.
</label>
<button type="submit">S'inscrire</button>
</form>

<h2>Déjà inscrit ?</h2>
<form id="login">
<input id="loginEmail" type="email"
 placeholder="Adresse e-mail" required>
<input id="loginPassword" type="password"
 placeholder="Mot de passe" required>
<button type="submit">Se connecter</button>
</form>

<p id="message" role="status"></p>
<p>Aucun paiement n'est effectué.</p>
</main>

<script>
const message = document.getElementById("message");

async function request(path, data) {
  const response = await fetch(path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.error || "Erreur du serveur");
  }

  return result;
}

document.getElementById("register")
.addEventListener("submit", async function(e) {
  e.preventDefault();
  message.textContent = "Création du compte...";

  try {
    await request("/api/register", {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });

    message.textContent =
      "Compte créé ! Tu peux maintenant te connecter.";
    document.getElementById("password").value = "";
  } catch (error) {
    message.textContent = error.message;
  }
});

document.getElementById("login")
.addEventListener("submit", async function(e) {
  e.preventDefault();
  message.textContent = "Connexion...";

  try {
    const result = await request("/api/login", {
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value
    });

    sessionStorage.setItem("jp_token", result.token);
    document.getElementById("loginPassword").value = "";
    message.textContent = "Connexion réussie !";
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
